.git_clone: &git_clone
  - git config --global http.version HTTP/1.1
  - git config --global advice.detachedHead false
  - git config --global user.email "dimagolov@gmail.com"
  - git config --global user.name "GitLab CI"

default:
  before_script:
    - git config --global --add safe.directory ${CI_PROJECT_DIR} || true
  hooks:
    pre_get_sources_script: *git_clone
  interruptible: true

stages:
  - build

.if_scheduled_then_skip: &if_scheduled_then_skip
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

.if_nightly_then_run: &if_nightly_then_run
  if: $CI_COMMIT_TAG =~ /^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$/

.if_semver_tag_then_run: &if_semver_tag_then_run
  if: $CI_COMMIT_TAG =~ /^[a-zA-Z0-9_.-]*?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][a-zA-Z0-9-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][a-zA-Z0-9-]*))*))?$/

.run_by_default: &run_by_default
  if: $CI == $CI # Hack to have true value

include:
  - local: ${CI_PROJECT_DIR}/.gitlab/build-default.yml
    rules:
      - *if_scheduled_then_skip
      - *run_by_default
  - local: ${CI_PROJECT_DIR}/.gitlab/build-tag.yml
    rules:
      - *if_scheduled_then_skip
      - *if_nightly_then_run
      - *if_semver_tag_then_run
